title: Jayden P. Grunde
description: Personal website of Jayden P. Grunde, Ph.D. student at Colorado School of Mines.
author: Jayden P. Grunde
email: jayden_grunde@mines.edu

# For a user site (yourusername.github.io) leave baseurl empty.
# For a project site (github.com/you/website) set baseurl: "/website"
baseurl: ""
url: ""

markdown: kramdown

collections:
